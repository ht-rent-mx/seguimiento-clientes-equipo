    onEntrar(acc.nivel==="lectura"?"ver":"edit");return true;

function VentasEntregas({registros,fEjec,ejecutivos}){
  const [anio,setAnio]=useState("Todos");
  const base=fEjec==="Todos"?registros:registros.filter(r=>r.ejecutivo===fEjec);
  const aniosSet=new Set();
  base.forEach(r=>{const v=mesDe(r.creado);if(v)aniosSet.add(v.anio);const e=fueEntregado(r)?mesDe(fechaEntrega(r)):null;if(e)aniosSet.add(e.anio);});
  const anios=[...aniosSet].sort((a,b)=>b-a);
  const okAnio=y=>anio==="Todos"||String(y)===anio;

  let ventasDinero=0,ventasUn=0,ventasNum=0,entrDinero=0,entrUn=0,entrNum=0;
  const porMes={}; const porEjec={};
  const addMes=(k,campo,dinero,un)=>{if(!porMes[k])porMes[k]={ventasD:0,ventasU:0,entrD:0,entrU:0};porMes[k][campo+"D"]+=dinero;porMes[k][campo+"U"]+=un;};
  const addEjec=(e,campo,dinero,un)=>{if(!porEjec[e])porEjec[e]={ventasD:0,ventasU:0,ventasN:0,entrD:0,entrU:0,entrN:0};porEjec[e][campo+"D"]+=dinero;porEjec[e][campo+"U"]+=un;porEjec[e][campo+"N"]+=1;};

  base.forEach(r=>{
    const val=valorVenta(r),un=unidades(r),ej=r.ejecutivo||"(sin ejecutivo)";
    const mv=mesDe(r.creado);
    if(mv&&okAnio(mv.anio)){ventasDinero+=val;ventasUn+=un;ventasNum++;addMes(mv.key,"ventas",val,un);addEjec(ej,"ventas",val,un);}
    if(fueEntregado(r)){const me=mesDe(fechaEntrega(r));if(me&&okAnio(me.anio)){entrDinero+=val;entrUn+=un;entrNum++;addMes(me.key,"entr",val,un);addEjec(ej,"entr",val,un);}}
  });

  const mesesOrden=Object.keys(porMes).sort();
  const maxMes=Math.max(1,...mesesOrden.map(k=>Math.max(porMes[k].ventasD,porMes[k].entrD)));
  const ejecs=Object.keys(porEjec).sort((a,b)=>porEjec[b].ventasD-porEjec[a].ventasD);
  const nombreMes=k=>{const[a,m]=k.split("-").map(Number);return MESES_V[m-1]+" "+a;};

  const KpiV=({label,dinero,unidades,num,tono})=>(<div className="rounded-xl border border-stone-200 bg-white px-4 py-3"><p className="text-xs font-medium text-slate-500">{label}</p><p className={`mt-1 text-2xl font-bold mono ${tono}`}>{pesos(dinero)}</p><p className="text-[11px] text-slate-400 mt-0.5">{num} operación(es) · {unidades} unidad(es)</p></div>);

  return (<div className="space-y-5">
    <div className="flex flex-wrap items-center justify-between gap-2">
      <div><h2 className="text-lg font-bold text-slate-900">Ventas y Entregas</h2><p className="text-xs text-slate-500">Ventas por fecha de alta · Entregas por fecha de entrega{fEjec!=="Todos"?" · "+fEjec:""}</p></div>
      <select value={anio} onChange={e=>setAnio(e.target.value)} className="rounded-lg border border-stone-300 px-3 py-2 text-sm"><option>Todos</option>{anios.map(a=><option key={a}>{a}</option>)}</select>
    </div>

    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
      <KpiV label="Total vendido" dinero={ventasDinero} unidades={ventasUn} num={ventasNum} tono="text-slate-900"/>
      <KpiV label="Total entregado" dinero={entrDinero} unidades={entrUn} num={entrNum} tono="text-teal-600"/>
    </div>

    <div className="rounded-xl border border-stone-200 bg-white p-4">
      <h3 className="text-sm font-bold text-slate-700 mb-3">Por mes</h3>
      {mesesOrden.length===0?<p className="text-xs text-slate-400">Sin datos todavía.</p>:
      <div className="space-y-2.5">{mesesOrden.map(k=>(<div key={k}>
        <div className="flex justify-between text-xs mb-0.5"><span className="font-semibold text-slate-600">{nombreMes(k)}</span></div>
        <div className="flex items-center gap-1.5"><span className="w-16 text-[10px] text-slate-400">Vendido</span><div className="flex-1 h-4 rounded bg-stone-100 overflow-hidden"><div className="h-full bg-slate-500" style={{width:`${porMes[k].ventasD/maxMes*100}%`}}></div></div><span className="w-24 text-right mono text-[11px] font-semibold text-slate-600">{pesos(porMes[k].ventasD)}</span></div>
        <div className="flex items-center gap-1.5 mt-0.5"><span className="w-16 text-[10px] text-slate-400">Entregado</span><div className="flex-1 h-4 rounded bg-stone-100 overflow-hidden"><div className="h-full bg-teal-500" style={{width:`${porMes[k].entrD/maxMes*100}%`}}></div></div><span className="w-24 text-right mono text-[11px] font-semibold text-teal-600">{pesos(porMes[k].entrD)}</span></div>
      </div>))}</div>}
    </div>

    <div className="rounded-xl border border-stone-200 bg-white overflow-hidden">
      <h3 className="text-sm font-bold text-slate-700 p-4 pb-2">Por ejecutivo</h3>
      <div className="overflow-x-auto"><table className="w-full text-sm"><thead className="bg-stone-50 text-left text-xs uppercase text-slate-500"><tr><th className="px-3 py-2">Ejecutivo</th><th className="px-3 py-2 text-right">Vendido</th><th className="px-3 py-2 text-right">Ventas</th><th className="px-3 py-2 text-right">Entregado</th><th className="px-3 py-2 text-right">Entregas</th></tr></thead>
      <tbody className="divide-y divide-stone-100">{ejecs.map(e=>(<tr key={e} className="hover:bg-stone-50"><td className="px-3 py-2 font-medium">{e}</td><td className="px-3 py-2 text-right mono">{pesos(porEjec[e].ventasD)}</td><td className="px-3 py-2 text-right text-slate-500">{porEjec[e].ventasN} · {porEjec[e].ventasU}u</td><td className="px-3 py-2 text-right mono text-teal-700">{pesos(porEjec[e].entrD)}</td><td className="px-3 py-2 text-right text-slate-500">{porEjec[e].entrN} · {porEjec[e].entrU}u</td></tr>))}
      {ejecs.length===0&&<tr><td colSpan={5} className="px-3 py-6 text-center text-slate-400">Sin datos.</td></tr>}</tbody>
      {ejecs.length>0&&<tfoot className="bg-stone-50 font-bold"><tr><td className="px-3 py-2">Total</td><td className="px-3 py-2 text-right mono">{pesos(ventasDinero)}</td><td className="px-3 py-2 text-right text-slate-500">{ventasNum} · {ventasUn}u</td><td className="px-3 py-2 text-right mono text-teal-700">{pesos(entrDinero)}</td><td className="px-3 py-2 text-right text-slate-500">{entrNum} · {entrUn}u</td></tr></tfoot>}
      </table></div>
    </div>
    <p className="text-[11px] text-slate-400">El valor de cada cliente se calcula con el precio de sus equipos (catálogo, editable en la ficha). Una venta = alta del cliente; una entrega = cliente marcado como Entregado.</p>
  </div>);
}

function interpretarCli(texto, ctx){
  const t=" "+_norm(texto)+" ";
  const res={busca:[]}; const hits=[];
  const STOP=new Set(["de","del","la","el","los","las","con","en","y","o","que","me","muestra","muestrame","dame","quiero","ver","todos","todas","clientes","cliente","por","para","un","una","estatus","etapa","los"]);
  const setExacto=(lista,label,key)=>{let mejor=null;(lista||[]).forEach(op=>{const n=_norm(op);if(!n)return;const re=new RegExp("(^| )"+n.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"( |$)");if(re.test(t)){if(!mejor||n.length>_norm(mejor).length)mejor=op;}});if(mejor){res[key]=mejor;hits.push(label+": "+mejor);}return mejor;};
  setExacto(ctx.ejecutivos,"Ejecutivo","ejec");
  setExacto(ctx.estatus,"Etapa","estatus");
  if(!res.estatus){
    if(/ entregad/.test(t)){res.estatus="Entregado";hits.push("Etapa: Entregado");}
    else if(/ cancelad/.test(t)){res.estatus="Cancelado";hits.push("Etapa: Cancelado");}
  }
  // palabras restantes -> búsqueda por texto (nombre de cliente, NIV, folio, equipo, empresa, contrato)
  const usados=_norm([res.ejec,res.estatus].filter(Boolean).join(" ")).split(" ");
  const palabras=_norm(texto).split(" ").filter(w=>w.length>=3&&!STOP.has(w)&&usados.indexOf(w)<0);
  if(palabras.length){res.busca=[...new Set(palabras)];hits.push("Texto: "+res.busca.join(" "));}
  return {res,hits};
}

    onAplicar(res);setMsg({ok:true,txt:"Aplicado → "+hits.join(" · ")});};

}

          <Kpi icon="clip" label="Expedientes por completar" valor={expIncompletos} tono="text-indigo-600"/>
          <Kpi icon="calendar" label="Entregas próx. 7 días" valor={entregas7} tono="text-emerald-600"/>
        </div>
        <TableroEtapas counts={etapaCounts} total={porEjec.length} activo={fEstatus} onPick={est=>{setFEstatus(fEstatus===est?"":est);setVista("clientes");}}/>

        <div className="flex items-center justify-between gap-3 flex-wrap mb-4">
          <div className="flex flex-wrap gap-1 border-b-[3px] border-navy"><Tab activo={vista==="clientes"} onClick={()=>setVista("clientes")}>Clientes</Tab><Tab activo={vista==="tablero"} onClick={()=>setVista("tablero")}>Tablero</Tab><Tab activo={vista==="lista"} onClick={()=>setVista("lista")}>Lista</Tab><Tab activo={vista==="dia"} onClick={()=>setVista("dia")}>Día</Tab><Tab activo={vista==="ventas"} onClick={()=>setVista("ventas")}>Ventas y Entregas</Tab></div>
          <div className="flex items-center gap-2 flex-wrap">
            <div className="flex items-center gap-1.5 rounded-lg border border-stone-300 bg-white px-2.5"><Icon name="search" size={14} className="text-slate-400"/><input value={busca} onChange={e=>setBusca(e.target.value)} placeholder="Buscar cliente, NIV, folio, tel…" className="py-1.5 text-sm outline-none w-48"/></div>
            <Select value={fEjec} onChange={cambiarEjec} options={["Todos",...ejecutivos]} prefijo="Ejecutivo"/>
            <Select value={fCli} onChange={setFCli} options={clientesOpc} prefijo="Cliente"/>
            <Select value={orden} onChange={setOrden} options={["Predeterminado","Más días en proceso","Menos días en proceso"]} prefijo="Orden"/>
          </div>
        </div>

        {fEstatus && <div className="mb-3"><span className="inline-flex items-center gap-2 rounded-lg bg-slate-100 px-3 py-1.5 text-xs font-semibold text-slate-700">Etapa: {fEstatus} <button onClick={()=>setFEstatus("")} className="text-slate-500 hover:text-red-500"><Icon name="x" size={13}/></button></span></div>}
        {vista==="ventas" && <VentasEntregas registros={registros} fEjec={fEjec} ejecutivos={ejecutivos}/>}
        {vista==="clientes" && (()=>{
          const cActivos=mostrados.filter(r=>seccDe(r)==="activos").length;
          const cEntreg=mostrados.filter(r=>seccDe(r)==="entregados").length;
          const cCancel=mostrados.filter(r=>seccDe(r)==="cancelados").length;
          const cDevu=mostrados.filter(r=>seccDe(r)==="devueltos").length;
          const sub=[["activos","En seguimiento",cActivos,"text-slate-700"],["entregados","Entregados",cEntreg,"text-teal-700"],["devueltos","Devueltos",cDevu,"text-purple-700"],["cancelados","Cancelados",cCancel,"text-rose-700"]];
          const lista=mostrados.filter(r=>seccDe(r)===subLista);
          return (<div>
            <div className="mb-3 inline-flex rounded-xl border border-stone-300 bg-white p-0.5">{sub.map(([k,l,n,col])=>(<button key={k} onClick={()=>setSubLista(k)} className={`rounded-lg px-3 py-1.5 text-xs font-semibold transition-all ${subLista===k?"bg-stone-800 text-white":`${col} hover:bg-stone-100`}`}>{l} <span className={`ml-0.5 ${subLista===k?"text-white/70":"text-slate-400"}`}>({n})</span></button>))}</div>
            {lista.length?<div className="grid gap-3 sm:grid-cols-2">{lista.map(r=><Tarjeta key={r.id} r={r} now={now} onEdit={setEditando} onListo={marcarLlamada}/>)}</div>:<Vacio texto={subLista==="activos"?"No hay clientes en seguimiento con los filtros actuales.":subLista==="entregados"?"No hay clientes entregados con los filtros actuales.":subLista==="devueltos"?"No hay clientes devueltos a comercial con los filtros actuales.":"No hay clientes cancelados con los filtros actuales."}/>}
          </div>);
        })()}
        {vista==="tablero" && <VistaTablero registros={visibles} now={now} onEdit={setEditando}/>}
        {vista==="lista" && <VistaLista registros={visibles} now={now} onEdit={setEditando}/>}
        {vista==="dia" && <AgendaDia dia={dia} setDia={setDia} agenda={agenda} onEdit={setEditando}/>}
      </main>

      {editando && ES_LEGAL() && editando!=="nuevo" && <FichaLegal r={editando} onClose={()=>setEditando(null)} onCambio={()=>{setEditando(null);recargar();}}/>}
      {editando && !ES_LEGAL() && <Modal onCambiado={recargar} puedeEditar={puedeEditar} inicial={editando==="nuevo"?null:editando} fEjec={fEjec} ejecutivos={ejecutivos} cliPorEjec={cliPorEjec} onClose={()=>setEditando(null)} onSave={guardar}/>}
    </div>
  );
}

/* ---------- Banner ---------- */
function Banner({urgentes,now,onEdit,onListo,hayVencidas}){
  const tono=hayVencidas?"border-red-300 bg-red-50":"border-amber-300 bg-amber-50";
  return (<div className={`mb-4 rounded-xl border ${tono} px-4 py-3`}><div className="flex items-center gap-2 mb-2"><Icon name="bell" size={16} className={hayVencidas?"text-red-600":"text-amber-600"}/><p className={`text-sm font-bold ${hayVencidas?"text-red-700":"text-amber-800"}`}>{urgentes.length} {urgentes.length===1?"llamada":"llamadas"} por atender</p></div><div className="flex flex-wrap gap-2">{urgentes.map(r=>{const venc=estadoCompromiso(r,now)==="vencido";return (<div key={r.id} className={`inline-flex items-center gap-2 rounded-lg border bg-white px-2.5 py-1.5 ${venc?"border-red-300":"border-amber-300"}`}><span className={`h-2 w-2 rounded-full ${venc?"bg-red-500":"bg-amber-500"}`}></span><button onClick={()=>onEdit(r)} className="text-sm font-semibold text-slate-800 hover:underline">{r.cliente}</button>{r.telefono && <a href={`tel:${r.telefono.replace(/[^0-9+]/g,"")}`} className="text-xs text-slate-500 hover:text-slate-800 mono">{r.telefono}</a>}<span className="text-xs text-slate-500 mono">{venc?"venció":""} {hora(r.compromiso)}</span><button onClick={()=>onListo(r.id)} title="Marcar realizada" className="grid h-5 w-5 place-items-center rounded text-emerald-600 hover:bg-emerald-50"><Icon name="check" size={14}/></button></div>);})}</div></div>);
}

/* ---------- Agenda Día ---------- */
function AgendaDia({dia,setDia,agenda,onEdit}){
  return (<div>
    <div className="flex items-center justify-between mb-4 rounded-lg border border-stone-200 bg-white px-3 py-2.5"><button onClick={()=>setDia(addDays(dia,-1))} className="grid h-8 w-8 place-items-center rounded-md hover:bg-stone-100 text-slate-600"><Icon name="left" size={18}/></button><div className="text-center"><p className="text-sm font-bold capitalize text-slate-900">{largo(dia)}</p><button onClick={()=>setDia(HOY)} className="text-xs text-amber-600 hover:underline mono">ir a hoy</button></div><button onClick={()=>setDia(addDays(dia,1))} className="grid h-8 w-8 place-items-center rounded-md hover:bg-stone-100 text-slate-600"><Icon name="right" size={18}/></button></div>
    {agenda.length===0?<Vacio texto="Sin interacciones registradas este día."/>:<div className="space-y-2">{agenda.map(({r,be})=>(<button key={r.id+"-"+be.id} onClick={()=>onEdit(r)} className="flex w-full items-start gap-3 rounded-lg border border-stone-200 bg-white p-3 text-left hover:shadow-sm"><TipoTag tipo={be.tipo}/><div className="min-w-0 flex-1"><div className="flex items-center gap-2"><p className="font-semibold text-slate-900 truncate">{r.cliente}</p><ContactoTag contacto={be.contacto} compacto/></div><p className="text-xs text-slate-500">{r.ejecutivo}</p>{be.resultado && <p className="mt-1 text-sm text-slate-600">{be.resultado}</p>}</div><Badge estatus={r.estatus}/></button>))}</div>}
  </div>);
}

/* ---------- Tablero ---------- */
function VistaTablero({registros,now,onEdit}){
  const panel=React.useRef(null), pista=React.useRef(null), arrastre=React.useRef(null);
  const [m,setM]=useState({ancho:0,visible:0,pos:0});
  const medir=React.useCallback(()=>{const p=panel.current;if(!p)return;setM({ancho:p.scrollWidth,visible:p.clientWidth,pos:p.scrollLeft});},[]);
  useEffect(()=>{medir();let ro=null;const p=panel.current;
    if(window.ResizeObserver&&p){ro=new ResizeObserver(medir);ro.observe(p);}
    window.addEventListener("resize",medir);
    return()=>{if(ro)ro.disconnect();window.removeEventListener("resize",medir);};},[registros,medir]);
  const sobra=Math.max(0,m.ancho-m.visible);
  const anchoPulgar=m.ancho>0?Math.max(8,(m.visible/m.ancho)*100):100;
  const izqPulgar=sobra>0?(m.pos/sobra)*(100-anchoPulgar):0;
  const irA=(clientX,rect)=>{const p=panel.current;if(!p||sobra<=0)return;
    const libre=rect.width*(1-anchoPulgar/100);
    const x=Math.min(Math.max(clientX-rect.left-(rect.width*anchoPulgar/100)/2,0),libre);
    p.scrollLeft=(libre>0?x/libre:0)*sobra;};
  const alBajar=e=>{const pista0=pista.current;if(!pista0)return;const rect=pista0.getBoundingClientRect();
    irA(e.clientX,rect);arrastre.current=rect;
    const mover=ev=>irA(ev.clientX,arrastre.current);
    const soltar=()=>{arrastre.current=null;window.removeEventListener("pointermove",mover);window.removeEventListener("pointerup",soltar);};
    window.addEventListener("pointermove",mover);window.addEventListener("pointerup",soltar);};
  return (<div>
    {sobra>0 && <div ref={pista} onPointerDown={alBajar} role="scrollbar" aria-label="Desplazar el tablero" aria-orientation="horizontal" title="Arrastra para ver las demás etapas"
      className="mb-2 h-3 w-full cursor-pointer rounded-full bg-stone-200 select-none touch-none">
      <div className="h-3 rounded-full bg-navy transition-[left] duration-75" style={{width:anchoPulgar+"%",marginLeft:izqPulgar+"%"}}></div>
    </div>}
    <div ref={panel} onScroll={medir} className="flex gap-3 overflow-x-auto pb-2">{ESTATUS.map(est=>{const items=registros.filter(r=>r.estatus===est);return (<div key={est} className="min-w-[200px] flex-1"><div className="flex items-center gap-2 mb-2 px-1"><span className={`h-2 w-2 rounded-full ${ESTATUS_COLOR[est].spine}`}></span><h3 className="text-xs font-bold uppercase tracking-wide text-slate-600 leading-tight">{est}</h3><span className="ml-auto text-xs text-slate-400 mono">{items.length}</span></div><div className="space-y-2">{items.map(r=><TarjetaMini key={r.id} r={r} now={now} onEdit={onEdit}/>)}{items.length===0 && <div className="rounded-lg border border-dashed border-stone-300 py-6 text-center text-xs text-slate-400">—</div>}</div></div>);})}</div>
  </div>);
}

/* ---------- Lista ---------- */
function VistaLista({registros,now,onEdit}){
  const orden=[...registros].sort((a,b)=>a.cliente.localeCompare(b.cliente));
  if(!orden.length)return <Vacio texto="No hay clientes con los filtros actuales."/>;
  return (<div className="overflow-x-auto rounded-lg border border-stone-200 bg-white"><table className="w-full text-sm"><thead><tr className="border-b border-stone-200 text-left text-xs uppercase tracking-wide text-slate-500"><th className="px-3 py-2.5 font-semibold">Cliente / Ejecutivo</th><th className="px-3 py-2.5 font-semibold">Tipo</th><th className="px-3 py-2.5 font-semibold">Equipo</th><th className="px-3 py-2.5 font-semibold">Estatus</th><th className="px-3 py-2.5 font-semibold">Expediente</th><th className="px-3 py-2.5 font-semibold">Últ. interacción</th><th className="px-3 py-2.5 font-semibold">Entrega</th><th className="px-3 py-2.5"></th></tr></thead><tbody>{orden.map(r=>{const st=reqStats(r);const u=ultInter(r);return (<tr key={r.id} className="border-b border-stone-100 last:border-0 hover:bg-stone-50"><td className="px-3 py-2.5"><p className="font-semibold text-slate-900">{r.cliente}</p><p className="text-xs text-slate-500">{r.ejecutivo}{r.telefono?" · "+r.telefono:""}</p></td><td className="px-3 py-2.5 text-xs text-slate-600 whitespace-nowrap">{r.tipoCliente==="Cliente Recurrente"?"Recurrente":"Nuevo"}</td><td className="px-3 py-2.5 text-slate-700 max-w-[170px]">{equiposTxt(r)||<span className="text-slate-300">—</span>}</td><td className="px-3 py-2.5"><Badge estatus={r.estatus}/></td><td className="px-3 py-2.5 whitespace-nowrap">{st.completo?<span className="inline-flex items-center gap-1 text-xs font-semibold text-emerald-600"><Icon name="check" size={12}/>Completo</span>:<span className="text-xs font-medium text-indigo-600 mono">{st.recibido}/{st.aplicables}</span>}</td><td className="px-3 py-2.5 whitespace-nowrap text-xs text-slate-500">{u?`${corto(u.fecha)} · ${u.contacto}`:<span className="text-slate-300">—</span>}</td><td className="px-3 py-2.5 whitespace-nowrap">{r.entregaProgramada?<span className="inline-flex items-center gap-1 text-emerald-700"><Icon name="truck" size={13}/>{corto(r.entregaProgramada)}</span>:<span className="text-slate-300">—</span>}</td><td className="px-3 py-2.5"><button onClick={()=>onEdit(r)} className="text-slate-400 hover:text-slate-700"><Icon name="pencil" size={15}/></button></td></tr>);})}</tbody></table></div>);
}

/* ---------- Expediente bar ---------- */
function primeraInter(r){const b=(r.bitacora||[]).filter(x=>x.fecha).slice().sort((a,b)=>(a.fecha||"").localeCompare(b.fecha||""));return b[0]||null;}
function diasEnGestion(r){const p=primeraInter(r);if(!p)return null;const fin=(r.devueltoComercial&&r.fechaDevuelto)?parse(r.fechaDevuelto):parse(HOY);return Math.max(0,Math.round((fin-parse(p.fecha))/86400000));}
function Cronometro({r}){
  if(["Entregado","Cancelado"].includes(r.estatus))return null;
  const d=diasEnGestion(r); if(d===null)return null;
  const pausado=esDevuelto(r);
  const pct=Math.min(100,Math.max(0,d/60*100)); const vencido=d>60;
  const col=d<=20?"text-emerald-600":d<=40?"text-amber-600":d<=60?"text-orange-600":"text-red-600";
  return (<div className="mt-2">
    <div className="flex items-center justify-between text-xs mb-1"><span className="font-semibold text-slate-600 inline-flex items-center gap-1"><Icon name="clock" size={12}/> Gestión (60 días){pausado&&<span className="ml-1 rounded bg-purple-100 px-1 py-0.5 text-[9px] font-bold text-purple-700">⏸ en comercial</span>}</span><span className={`mono font-bold ${col}`}>{vencido?`Vencido +${d-60}d`:`Día ${d} de 60`}</span></div>
    <div className="relative h-2 w-full rounded-full overflow-hidden" style={{background:"linear-gradient(to right,#22c55e 0%,#22c55e 28%,#fbbf24 40%,#f59e0b 60%,#f97316 78%,#ef4444 100%)"}}><div className="absolute -top-0.5 h-3 w-1 rounded bg-slate-900" style={{left:`calc(${pct}% - 2px)`}}></div></div>
    <p className="mt-1 text-[11px] text-slate-400">{vencido?"Fuera del plazo de 60 días":`Quedan ${60-d} días para entregar`}</p>
  </div>);
}
function ReqBarra({r}){
  const st=reqStats(r);
  if(st.completo)return <div className="mt-2 inline-flex items-center gap-1.5 rounded-md border border-emerald-200 bg-emerald-50 px-2 py-1 text-xs font-semibold text-emerald-700"><Icon name="clip" size={12}/> Expediente completo</div>;
  const pct=st.aplicables?Math.round(st.recibido/st.aplicables*100):0;
  return (<div className="mt-2"><div className="flex items-center justify-between text-xs mb-1"><span className="font-semibold text-slate-600 inline-flex items-center gap-1"><Icon name="clip" size={12}/> Expediente</span><span className="mono text-indigo-600 font-semibold">{st.recibido}/{st.aplicables}</span></div><div className="h-1.5 w-full rounded-full bg-stone-200 overflow-hidden"><div className="h-full bg-indigo-500" style={{width:pct+"%"}}></div></div>{st.faltan.length>0 && <p className="mt-1 text-xs text-slate-500 truncate">Faltan: {st.faltan.slice(0,3).join(", ")}{st.faltan.length>3?` +${st.faltan.length-3}`:""}</p>}</div>);
}

/* ---------- Tags ---------- */
function TipoTag({tipo}){return <span className="rounded border border-stone-200 bg-stone-50 px-1.5 py-0.5 text-[10px] font-bold tracking-wide text-slate-500 mono shrink-0">{TIPO_ABBR[tipo]||tipo}</span>;}
function EmpresaTag({empresa}){return empresa?<span className="rounded bg-slate-800 px-1.5 py-0.5 text-[10px] font-bold text-white mono">{empresa}</span>:null;}
function ClienteTipoTag({tc}){const rec=tc==="Cliente Recurrente";return <span className={`inline-flex items-center gap-0.5 rounded px-1.5 py-0.5 text-[10px] font-bold ${rec?"bg-teal-100 text-teal-700":"bg-sky-100 text-sky-700"}`}><Icon name="user" size={9}/>{rec?"RECURRENTE":"NUEVO"}</span>;}

/* ---------- Tarjeta ---------- */
function Tarjeta({r,now,onEdit,onListo}){
  const c=ESTATUS_COLOR[r.estatus];const e=estadoCompromiso(r,now);const eqt=equiposTxt(r);const u=ultInter(r);const nb=(r.bitacora||[]).length;
  const ring=e==="vencido"?"ring-2 ring-red-400 border-red-300":e==="proximo"?"ring-2 ring-amber-400 border-amber-300":"border-stone-200";
  return (<div className={`group relative w-full overflow-hidden rounded-xl border bg-white transition-shadow hover:shadow-md ${ring}`}><span className={`absolute inset-y-0 left-0 w-1.5 ${c.spine}`}></span>
    <button onClick={()=>onEdit(r)} className="block w-full p-4 pl-5 text-left">
      <div className="flex items-start justify-between gap-2"><div className="flex items-center gap-2 min-w-0">{e && <span className={`h-2.5 w-2.5 rounded-full shrink-0 ${e==="vencido"?"bg-red-500":e==="proximo"?"bg-amber-500":"bg-sky-400"}`}></span>}<div className="min-w-0"><div className="flex items-center gap-1.5"><p className={`font-bold leading-tight truncate ${e==="vencido"?"text-red-700":e==="proximo"?"text-amber-800":"text-slate-900"}`}>{r.cliente}</p></div><p className="text-xs text-slate-500 mt-0.5">{r.ejecutivo}</p>{r.tipoContrato&&<span className={`mt-1 inline-block rounded border px-1.5 py-0.5 text-[10px] font-bold ${r.tipoContrato==="Notariado"?"border-violet-200 bg-violet-50 text-violet-700":"border-sky-200 bg-sky-50 text-sky-700"}`}>Contrato {r.tipoContrato}</span>}{esDevuelto(r)&&<span className="mt-1 ml-1 inline-block rounded border border-purple-300 bg-purple-50 px-1.5 py-0.5 text-[10px] font-bold text-purple-700">Devuelto a comercial</span>}{(r.tipoPersona||"")==="Persona moral"&&<span className="mt-1 ml-1 inline-block rounded border border-stone-300 bg-stone-50 px-1.5 py-0.5 text-[10px] font-bold text-slate-600">Persona moral</span>}{enDictamen(r)&&<span className="mt-1 ml-1 inline-block rounded border border-sky-300 bg-sky-50 px-1.5 py-0.5 text-[10px] font-bold text-sky-700">En dictamen{diasDesde(r.enviadoLegal)!=null?` · día ${diasDesde(r.enviadoLegal)}`:""}</span>}{esParcial(r)&&<span className="mt-1 ml-1 inline-block rounded border border-amber-300 bg-amber-50 px-1.5 py-0.5 text-[10px] font-bold text-amber-700">Entrega parcial {entregadosCli(r)}/{unidades(r)}</span>}{(r.folioVenta||r.folioJJ)&&<p className="text-[10px] text-slate-400 mono mt-0.5">{r.folioVenta?`V: ${r.folioVenta}`:""}{r.folioVenta&&r.folioJJ?"  ·  ":""}{r.folioJJ?`JJ: ${r.folioJJ}`:""}</p>}</div></div><div className="flex flex-col items-end gap-1 shrink-0"><Badges r={r}/><div className="flex items-center gap-1"><ClienteTipoTag tc={r.tipoCliente}/><EmpresaTag empresa={r.empresa}/></div></div></div>
      {eqt && <p className="mt-2 text-xs font-medium text-slate-600 inline-flex items-start gap-1"><Icon name="truck" size={12} className="text-slate-400 mt-0.5 shrink-0"/><span>{eqt}</span></p>}
      {r.niv && <p className="mt-1 text-xs text-slate-500 mono truncate">NIV: {String(r.niv).split(/[\n,]+/).map(x=>x.trim()).filter(Boolean).join(", ")}</p>}{r.tipoVenta && <p className="mt-1 text-xs text-slate-500"><span className="font-semibold text-slate-600">{r.tipoVenta}</span>{r.plazo?` · ${r.plazo} meses`:""}</p>}
      <div className="mt-2 rounded-md bg-stone-50 border border-stone-100 px-2 py-1.5 text-xs">{u?(<div className="flex items-start gap-1.5"><Icon name="history" size={12} className="text-slate-400 mt-0.5 shrink-0"/><div className="min-w-0"><span className="font-semibold text-slate-600">{corto(u.fecha)} · {u.tipo} · </span><ContactoTag contacto={u.contacto} inline/>{u.resultado && <span className="text-slate-600"> — {u.resultado}</span>}<span className="text-slate-400 mono"> · {nb} {nb===1?"interacción":"interacciones"}</span></div></div>):<span className="text-slate-400 inline-flex items-center gap-1"><Icon name="history" size={12}/> Sin interacciones aún</span>}</div>
      {r.adicionales&&r.adicionales.length>0 && <div className="mt-2 flex flex-wrap gap-1">{r.adicionales.map(a=><span key={a} className="inline-flex items-center gap-0.5 rounded bg-stone-100 px-1.5 py-0.5 text-[10px] font-medium text-slate-500"><Icon name="tag" size={9}/>{a}</span>)}</div>}

            <button onClick={()=>setF(p=>({...p,devueltoComercial:!p.devueltoComercial,fechaDevuelto:!p.devueltoComercial?(p.fechaDevuelto||HOY):p.fechaDevuelto}))} className={`shrink-0 rounded-lg border px-3 py-2 text-xs font-semibold ${f.devueltoComercial?"border-purple-500 bg-purple-600 text-white":"border-stone-300 text-slate-600 hover:bg-stone-50"}`}>{f.devueltoComercial?"✓ Devuelto":"Marcar devuelto"}</button>
          </div>
          {f.devueltoComercial && <div className="mt-2 grid gap-2 sm:grid-cols-3">
            <label className="text-xs"><span className="text-slate-500 font-medium">Fecha</span><input type="date" value={f.fechaDevuelto||""} onChange={e=>setF(p=>({...p,fechaDevuelto:e.target.value}))} className="mt-1 w-full rounded-lg border border-stone-300 bg-white px-2 py-1.5 text-sm outline-none focus:border-purple-400"/></label>
            <label className="text-xs sm:col-span-2"><span className="text-slate-500 font-medium">Motivo (opcional)</span><input value={f.motivoDevuelto||""} onChange={e=>setF(p=>({...p,motivoDevuelto:e.target.value}))} placeholder="Ej. no responde, sin avance…" className="mt-1 w-full rounded-lg border border-stone-300 bg-white px-2 py-1.5 text-sm outline-none focus:border-purple-400"/></label>
          </div>}
        </div>

        <Campo label="NIV de equipo"><textarea value={f.niv} onChange={e=>set("niv",e.target.value)} rows={2} placeholder="Captura uno o varios NIV (uno por línea o separados por coma)" className={inp}/></Campo>
        <div><span className="mb-1 block text-xs font-semibold uppercase tracking-wide text-slate-500">Tipo de contrato</span><div className="grid grid-cols-2 gap-2">{TIPO_CONTRATO.map(op=>{const a=f.tipoContrato===op;return <button key={op} onClick={()=>set("tipoContrato",a?"":op)} className={`rounded-lg border px-2 py-2 text-sm font-medium ${a?(op==="Notariado"?"bg-violet-600 text-white border-violet-600":"bg-sky-600 text-white border-sky-600"):"border-stone-300 text-slate-600 hover:bg-stone-50"}`}>{op}</button>;})}</div></div>
        <div><span className="mb-1 block text-xs font-semibold uppercase tracking-wide text-slate-500">Tipo de venta</span><div className="grid grid-cols-2 gap-2">{TIPOVENTA.map(op=>{const a=f.tipoVenta===op;return <button key={op} onClick={()=>setTV(a?"":op)} className={`rounded-lg border px-2 py-2 text-sm font-medium ${a?"bg-slate-800 text-white border-slate-800":"border-stone-300 text-slate-600 hover:bg-stone-50"}`}>{op}</button>;})}</div>{plazosDisp.length>0 && (<div className="mt-2 rounded-lg bg-stone-50 border border-stone-200 p-2"><span className="mb-1.5 block text-[11px] font-semibold uppercase tracking-wide text-slate-500">Plazo</span><div className="flex flex-wrap gap-1.5">{plazosDisp.map(p=>{const a=f.plazo===p;return <button key={p} onClick={()=>set("plazo",a?"":p)} className={`rounded-full border px-3 py-1 text-xs font-semibold ${a?"bg-amber-500 text-white border-amber-500":"border-stone-300 text-slate-600 hover:bg-white"}`}>{p} meses</button>;})}</div></div>)}</div>

        <div><span className="mb-1 block text-xs font-semibold uppercase tracking-wide text-slate-500">Adicionales del equipo</span><div className="flex flex-wrap gap-1.5">{ADICIONALES.map(a=>{const sel=f.adicionales.includes(a);return <button key={a} onClick={()=>toggleAdi(a)} className={`inline-flex items-center gap-1 rounded-full border px-2.5 py-1 text-xs font-medium ${sel?"bg-amber-50 text-amber-800 border-amber-300":"border-stone-300 text-slate-500 hover:bg-stone-50"}`}>{sel && <Icon name="check" size={12}/>}{a}</button>;})}</div></div>

        {/* Bitácora */}
        <div className="rounded-xl border border-slate-200 bg-slate-50 p-3">
          <div className="flex items-center gap-1.5 mb-2 text-xs font-semibold uppercase tracking-wide text-slate-500"><Icon name="history" size={14}/> Registrar interacción</div>
          <div className="grid grid-cols-2 gap-2 mb-2"><input type="date" value={nb.fecha} onChange={e=>setNb({...nb,fecha:e.target.value})} className={inp}/><select value={nb.tipo} onChange={e=>setNb({...nb,tipo:e.target.value})} className={inp}>{TIPOS.map(t=><option key={t}>{t}</option>)}</select></div>
          <div className="grid grid-cols-2 gap-2 mb-2">{CONTACTO.map(op=>{const a=nb.contacto===op;const s=op==="Contestó"?(a?"bg-emerald-600 text-white border-emerald-600":"border-stone-300 text-slate-600 hover:bg-emerald-50"):(a?"bg-red-500 text-white border-red-500":"border-stone-300 text-slate-600 hover:bg-red-50");return <button key={op} onClick={()=>setNb({...nb,contacto:op})} className={`rounded-lg border px-2 py-2 text-sm font-medium ${s}`}>{op}</button>;})}</div>
          <textarea value={nb.resultado} onChange={e=>setNb({...nb,resultado:e.target.value})} rows={2} placeholder="¿Qué pasó en esta interacción? (resultado, qué se pidió, siguiente paso…)" className={inp}/>
          <button onClick={addBit} className="mt-2 inline-flex items-center gap-1 rounded-lg bg-slate-900 px-3 py-1.5 text-xs font-semibold text-white hover:bg-slate-800"><Icon name="plus" size={13}/> Agregar a la bitácora</button>
          {bitOrd.length>0 && (<div className="mt-3 space-y-1.5 border-t border-slate-200 pt-2">{bitOrd.map(be=>(<div key={be.id} className="flex items-start gap-2 rounded-md bg-white border border-stone-200 px-2 py-1.5 text-xs"><TipoTag tipo={be.tipo}/><div className="min-w-0 flex-1"><div className="flex items-center gap-1.5"><span className="font-semibold text-slate-600">{corto(be.fecha)}</span><ContactoTag contacto={be.contacto} compacto/></div>{be.resultado && <p className="text-slate-600">{be.resultado}</p>}</div><button onClick={()=>delBit(be.id)} className="text-slate-300 hover:text-red-500"><Icon name="x" size={13}/></button></div>))}</div>)}
        </div>

        <Campo label="Estatus de la solicitud (marca todas las etapas que apliquen)"><div className="flex flex-wrap gap-1.5">{ESTATUS.map(est=>{const on=(f.estatuses||[]).includes(est);return <button key={est} onClick={()=>toggleEst(est)} className={`rounded-full border px-2.5 py-1 text-xs font-medium ${on?ESTATUS_COLOR[est].chip+" ring-2 ring-offset-1 ring-slate-300":"border-stone-300 text-slate-500 hover:bg-stone-50"}`}>{on?"✓ ":""}{est}</button>;})}</div><span className="mt-1.5 block text-[11px] text-slate-400">En el tablero y los conteos aparece según la etapa más avanzada marcada: <span className="font-semibold text-slate-600">{principal(f.estatuses||[])}</span></span></Campo>

        <div className="rounded-xl border border-stone-200 bg-stone-50 p-3"><div className="flex items-center justify-between mb-2"><div className="flex items-center gap-1.5 text-xs font-semibold uppercase tracking-wide text-slate-500"><Icon name="clip" size={14}/> Requisitos · {f.tipoCliente==="Cliente Recurrente"?"Recurrente":"Nuevo"}</div><span className={`text-xs font-bold mono ${st.completo?"text-emerald-600":"text-indigo-600"}`}>{st.completo?"Completo":`${st.recibido}/${st.aplicables}`}</span></div><p className="text-xs text-slate-400 mb-2">Clic para alternar: <span className="text-slate-500 font-medium">Pendiente → Recibido → No aplica</span> · 📷 escanea con la cámara · 📎 sube archivo o PDF</p><div className="space-y-1.5">{reqListFor(f.tipoCliente).map(k=>{const v=f.requisitos[k]||"pendiente";const s=v==="recibido"?"bg-emerald-600 text-white border-emerald-600":v==="na"?"bg-stone-100 text-slate-400 border-stone-200 line-through":"bg-white border-stone-300 text-slate-600 hover:bg-stone-50";const lista=((f.archivos||{})[k])||[];return (<div key={k} className="rounded-lg border border-stone-200 bg-white p-1.5"><div className="flex items-center gap-1.5"><button onClick={()=>ciclaReq(k)} className={`flex flex-1 min-w-0 items-center gap-1.5 rounded-md border px-2.5 py-1.5 text-xs font-medium text-left ${s}`}><span className="shrink-0">{v==="recibido"?<Icon name="check" size={13}/>:v==="na"?<Icon name="x" size={12}/>:<span className="inline-block h-3 w-3 rounded-full border border-current opacity-40"></span>}</span><span className="truncate">{k}</span>{lista.length>0&&<span className="ml-auto shrink-0 rounded-full bg-black/10 px-1.5 py-0.5 text-[10px] font-bold">{lista.length}</span>}</button><label title="Escanear con la cámara" className="cursor-pointer shrink-0 rounded-md border border-emerald-300 bg-emerald-50 px-2 py-1.5 text-xs font-semibold text-emerald-700 hover:bg-emerald-100">📷<input type="file" accept="image/*" capture="environment" className="hidden" onChange={e=>{const fl=e.target.files[0];if(fl)subirArchivo(k,fl);e.target.value="";}}/></label><label title="Subir archivo o PDF" className="cursor-pointer shrink-0 rounded-md border border-stone-300 bg-white px-2 py-1.5 text-xs font-semibold text-slate-600 hover:bg-stone-50">📎<input type="file" accept="image/*,application/pdf" className="hidden" onChange={e=>{const fl=e.target.files[0];if(fl)subirArchivo(k,fl);e.target.value="";}}/></label></div>{subiendo===k && <p className="mt-1 text-[11px] font-medium text-sky-600">Subiendo…</p>}{lista.length>0 && <div className="mt-1.5 flex flex-wrap gap-1.5">{lista.map((a,i)=>(<div key={i} className="relative"><a href={a.url} target="_blank" rel="noopener"><img src={`https://drive.google.com/thumbnail?id=${a.id}&sz=w120`} alt={a.nombre} className="h-12 w-12 rounded border border-stone-200 object-cover bg-stone-50"/></a><button onClick={()=>quitarArchivo(k,i)} className="absolute -right-1 -top-1 grid h-4 w-4 place-items-center rounded-full border border-stone-200 bg-white text-slate-400 shadow hover:text-red-500"><Icon name="x" size={9}/></button></div>))}</div>}</div>);})}</div></div>

        <Campo label="Pendiente actual (nota)"><textarea value={f.queFalta} onChange={e=>set("queFalta",e.target.value)} rows={2} placeholder="Algo fuera del expediente (ej. cliente confirma plazo)…" className={inp}/></Campo>
        <div className="rounded-xl border border-stone-200 bg-stone-50 p-3 space-y-3"><div className="flex items-center gap-1.5 text-xs font-semibold uppercase tracking-wide text-slate-500"><Icon name="alarm" size={14}/> Próximo compromiso de llamada</div><input type="datetime-local" value={f.compromiso} onChange={e=>set("compromiso",e.target.value)} className={inp}/>{f.compromiso && <label className="flex items-center gap-2 text-sm text-slate-600"><input type="checkbox" checked={f.compromisoCumplido} onChange={e=>set("compromisoCumplido",e.target.checked)} className="h-4 w-4"/> Ya realicé esta llamada</label>}<p className="text-xs text-slate-400">Con fecha y hora, el cliente se marca en rojo (vencida) o ámbar (por marcar pronto).</p></div>
        <Campo label="Patio de entrega"><select value={f.patioEntrega} onChange={e=>set("patioEntrega",e.target.value)} className={inp}><option value="">— Selecciona patio —</option>{PATIOS.map(p=><option key={p}>{p}</option>)}</select></Campo>
        <div className="grid grid-cols-2 gap-3"><Campo label="Entrega de fábrica o taller" hint="Cuándo llega el equipo"><input type="date" value={f.entregaFabrica} onChange={e=>set("entregaFabrica",e.target.value)} className={inp}/></Campo><Campo label="Fecha de entrega al cliente"><input type="date" value={f.entregaProgramada} onChange={e=>set("entregaProgramada",e.target.value)} className={inp}/></Campo></div>
        <Campo label="Notas (opcional)"><textarea value={f.notas} onChange={e=>set("notas",e.target.value)} rows={2} className={inp}/></Campo>
        {inicial && inicial.id>0 && USUARIO && <BloqueDictamen r={{...inicial,requisitos:f.requisitos,tipoCliente:f.tipoCliente,tipoPersona:f.tipoPersona}} expedienteCompleto={listoParaDictamen({...inicial,requisitos:f.requisitos,tipoCliente:f.tipoCliente})} onCambio={onCambiado}/>}
        {inicial && inicial.id>0 && USUARIO && <HistorialCambios id={inicial.id}/>}
      </div>
      <div className="sticky bottom-0 flex justify-end gap-2 border-t border-stone-200 bg-white px-5 py-3"><button onClick={onClose} className="rounded-lg px-3.5 py-2 text-sm font-semibold text-slate-600 hover:bg-stone-100">Cancelar</button><button onClick={()=>valido&&guardarLimpio()} disabled={!valido||!puedeEditar} title={puedeEditar?"":"Modo consulta: no puedes guardar"} className="rounded-lg border border-lime bg-lime px-5 py-2 text-sm font-bold text-lime-dark hover:brightness-95 disabled:opacity-40">{inicial?"Guardar cambios":"Crear cliente"}</button></div>
    </div>
  </div>);
}

/* ---------- Ficha reducida para el área legal ---------- */
function FichaLegal({r, onClose, onCambio}){
  const [archivos,setArchivos]=useState(()=>JSON.parse(JSON.stringify(r.archivos||{})));
  const [subiendo,setSubiendo]=useState("");const [nota,setNota]=useState("");
  const [err,setErr]=useState("");const [msg,setMsg]=useState("");const [ocupado,setOcupado]=useState(false);
  const dias=diasDesde(r.enviadoLegal);
  const vencido=enDictamen(r)&&dias!=null&&dias>PLAZO_DICTAMEN;
  const tieneDictamen=((archivos[DOC_DICTAMEN])||[]).length>0;
  async function subir(docKey,file){
    try{setSubiendo(docKey);setErr("");
      const c=await comprimir(file);
      const j=await apiUpload(String(r.cliente||"").trim(), docKey, c.nombre, c.mime, c.b64);
      const nuevos={...archivos,[docKey]:[...((archivos[docKey])||[]),{id:j.id,url:j.url,nombre:c.nombre,fecha:HOY}]};
      setArchivos(nuevos);
      await apiSave({...r, archivos:nuevos});
    }catch(e){setErr("No se pudo subir: "+e.message);}finally{setSubiendo("");}
  }
  async function dictaminar(){
    if(ocupado)return;
    if(!tieneDictamen){setErr("Primero sube el archivo del dictamen.");return;}
    setOcupado(true);setErr("");
    try{ await apiDictaminado(r.id, nota.trim()); setMsg("Dictamen enviado a Servicio a Clientes."); setTimeout(()=>onCambio&&onCambio(),900); }
    catch(e){ setErr(e.message); } finally{ setOcupado(false); }
  }
  const Doc=({k, destacado})=>{
    const lista=(archivos[k])||[];
    return (<div className={`rounded-lg border p-3 ${destacado?"border-lime bg-lime-soft/40":"border-stone-200"}`}>
      <div className="flex flex-wrap items-center justify-between gap-2">
        <span className="text-sm font-semibold text-navy">{k}{lista.length>0 && <span className="ml-2 rounded-full bg-navy px-2 py-0.5 text-[10px] font-bold text-white">{lista.length}</span>}</span>
        <div className="flex gap-1.5">
          <label className="cursor-pointer rounded-md border border-emerald-300 bg-emerald-50 px-2.5 py-1.5 text-xs font-semibold text-emerald-700 hover:bg-emerald-100">📷 Cámara
            <input type="file" accept="image/*" capture="environment" className="hidden" onChange={e=>{const fl=e.target.files[0];if(fl)subir(k,fl);e.target.value="";}}/></label>
          <label className="cursor-pointer rounded-md border border-stone-300 bg-white px-2.5 py-1.5 text-xs font-semibold text-slate-600 hover:bg-stone-50">📎 Archivo
            <input type="file" accept="image/*,application/pdf" className="hidden" onChange={e=>{const fl=e.target.files[0];if(fl)subir(k,fl);e.target.value="";}}/></label>
        </div>
      </div>
      {subiendo===k && <p className="mt-1 text-[11px] font-semibold text-sky-600">Subiendo…</p>}
      {lista.length>0
        ? <ul className="mt-2 space-y-1">{lista.map((a,i)=>(<li key={i} className="text-xs"><a className="font-semibold text-navy underline" href={a.url} target="_blank" rel="noopener">{a.nombre}</a> <span className="text-slate-400">· {a.fecha}</span></li>))}</ul>
        : <p className="mt-1 text-xs text-slate-400">Sin archivo cargado.</p>}
    </div>);
  };
  return (<div className="fixed inset-0 z-50 flex justify-end" style={{background:"rgba(5,15,30,.55)"}} onClick={onClose}>
    <div className="h-full w-full sm:max-w-2xl overflow-y-auto bg-white shadow-2xl" onClick={e=>e.stopPropagation()}>
      <div className="sticky top-0 z-10 flex items-center justify-between gap-3 border-b-4 border-lime bg-navy px-5 py-3.5" style={{paddingTop:"calc(14px + env(safe-area-inset-top,0px))"}}>
        <div className="min-w-0"><h2 className="font-display text-xl text-white leading-tight truncate">{r.cliente}</h2>
          <p className="text-[12px] truncate" style={{color:"#B9C8DC"}}>Dictamen legal · {r.empresa||"—"}</p></div>
        <button onClick={onClose} aria-label="Cerrar" className="grid h-9 w-9 shrink-0 place-items-center rounded border border-navy-edge text-white hover:bg-navy-2"><Icon name="x" size={18}/></button>
      </div>

      <div className="p-5 space-y-4">
        {enDictamen(r) && <div className={`rounded-lg border border-l-[6px] px-4 py-2 text-sm font-semibold ${vencido?"border-red-500 bg-red-50 text-red-700":"border-lime bg-lime-soft text-navy"}`}>
          {dias==null?"Expediente recibido para dictamen":`Día ${dias} de ${PLAZO_DICTAMEN} para dictaminar${vencido?" · vencido":""}`}</div>}

        <div className="rounded-lg border border-stone-200 p-3">
          <h3 className="text-xs font-bold uppercase tracking-wide text-slate-500 mb-2">Datos del cliente</h3>
          <dl className="grid grid-cols-2 gap-x-4 gap-y-2 text-sm">
            <div><dt className="text-xs text-slate-500">Cliente</dt><dd className="font-semibold">{r.cliente}</dd></div>
            <div><dt className="text-xs text-slate-500">Tipo de persona</dt><dd className="font-semibold">{r.tipoPersona||"—"}</dd></div>
            <div><dt className="text-xs text-slate-500">Empresa</dt><dd>{r.empresa||"—"}</dd></div>
            <div><dt className="text-xs text-slate-500">Ejecutivo</dt><dd>{r.ejecutivo||"—"}</dd></div>
            <div><dt className="text-xs text-slate-500">Folio de venta</dt><dd className="mono">{r.folioVenta||"—"}</dd></div>
            <div><dt className="text-xs text-slate-500">Tipo de venta</dt><dd>{r.tipoVenta||"—"}{r.plazo?` · ${r.plazo} meses`:""}</dd></div>
            <div className="col-span-2"><dt className="text-xs text-slate-500">Equipos</dt><dd>{equiposTxt(r)||"—"}</dd></div>
            {r.tipoContrato && <div className="col-span-2"><dt className="text-xs text-slate-500">Tipo de contrato</dt><dd>{r.tipoContrato}</dd></div>}
          </dl>
        </div>

        <div>
          <h3 className="text-xs font-bold uppercase tracking-wide text-slate-500 mb-2">Documentos legales</h3>
          <div className="space-y-2">{DOCS_LEGALES.map(k=><Doc key={k} k={k}/>)}</div>
        </div>

        <div>
          <h3 className="text-xs font-bold uppercase tracking-wide text-slate-500 mb-2">Tu dictamen</h3>
          <Doc k={DOC_DICTAMEN} destacado/>
          <textarea rows={3} value={nota} onChange={e=>setNota(e.target.value)} placeholder="Resumen o conclusión del dictamen (opcional)…" className="mt-2 w-full rounded-lg border border-stone-300 bg-white px-3 py-2 text-sm outline-none focus:border-navy focus:ring-2 focus:ring-lime-soft"/>
        </div>

        {err && <p className="rounded-lg border border-l-[6px] border-red-500 bg-red-50 px-3 py-2 text-xs font-semibold text-red-700">{err}</p>}
        {msg && <p className="rounded-lg border border-l-[6px] border-lime bg-lime-soft px-3 py-2 text-xs font-semibold text-navy">{msg}</p>}
      </div>

      <div className="sticky bottom-0 flex flex-wrap items-center justify-end gap-2 border-t border-stone-200 bg-white px-5 py-3" style={{paddingBottom:"calc(12px + env(safe-area-inset-bottom,0px))"}}>
        {!tieneDictamen && <span className="mr-auto text-xs text-slate-400">Sube el archivo del dictamen para poder enviarlo.</span>}
        <button onClick={onClose} className="rounded-lg px-3.5 py-2 text-sm font-semibold text-slate-600 hover:bg-stone-100">Cerrar</button>
        <button onClick={dictaminar} disabled={ocupado||!tieneDictamen} className="rounded-lg border border-lime bg-lime px-5 py-2 text-sm font-bold text-lime-dark hover:brightness-95 disabled:opacity-40">{ocupado?"Enviando…":"Enviar a Servicio a Clientes"}</button>
      </div>
    </div>
  </div>);
}

/* ---------- Dictamen legal (persona moral) ---------- */
function BloqueDictamen({r, expedienteCompleto, onCambio}){
  const [msg,setMsg]=useState("");const [err,setErr]=useState("");const [ocupado,setOcupado]=useState(false);
  const [nota,setNota]=useState("");
  const legal=ES_LEGAL();
  const moral=(r.tipoPersona||"")==="Persona moral";
  const dict=r.dictamenLegal||null;
  const dias=diasDesde(r.enviadoLegal);
  const vencido=enDictamen(r)&&dias!=null&&dias>PLAZO_DICTAMEN;
  if(!moral && !enDictamen(r) && !yaDictaminado(r)) return null;
  async function accion(fn,txt){
    if(ocupado)return; setOcupado(true); setErr(""); setMsg("");
    try{ await fn(); setMsg(txt); onCambio&&onCambio(); }
    catch(e){ setErr(e.message); } finally{ setOcupado(false); }
  }
  return (<div className="rounded-lg border border-stone-200 p-3">
    <div className="flex flex-wrap items-center justify-between gap-2 mb-2">
      <h3 className="text-xs font-bold uppercase tracking-wide text-slate-500">Dictamen legal</h3>
      {enDictamen(r) && <span className={`rounded-full px-2 py-0.5 text-[11px] font-bold ${vencido?"bg-red-50 text-red-700":"bg-sky-50 text-sky-700"}`}>
        {dias==null?"En dictamen":`Día ${dias} de ${PLAZO_DICTAMEN}${vencido?" · vencido":""}`}</span>}
    </div>

    {yaDictaminado(r) ? <p className="text-sm">Dictaminado{dict?` por ${dict.por||"—"} · ${String(dict.fecha||"").replace("T"," ")}`:""}.{dict&&dict.nota?<span className="block text-slate-600">{dict.nota}</span>:null}</p>
     : enDictamen(r) ? <p className="text-sm text-slate-600">El expediente está con el área legal{r.enviadoLegal?` desde el ${String(r.enviadoLegal).slice(0,10)}`:""}.</p>
     : <p className="text-sm text-slate-600">Cliente persona moral: antes de contratos, el expediente pasa por dictamen legal.</p>}

    {legal && enDictamen(r) && <div className="mt-3 space-y-2">
      <textarea rows={3} value={nota} onChange={e=>setNota(e.target.value)} placeholder="Resumen del dictamen (opcional)…" className="w-full rounded-lg border border-stone-300 bg-white px-3 py-2 text-sm outline-none focus:border-navy focus:ring-2 focus:ring-lime-soft"/>
      <p className="text-[11px] text-slate-400">Sube el documento del dictamen en la lista de requisitos, con el botón 📎, antes de marcarlo.</p>
      <button onClick={()=>accion(()=>apiDictaminado(r.id,nota.trim()),"Marcado como dictaminado.")} disabled={ocupado} className="rounded-lg border border-lime bg-lime px-4 py-2 text-sm font-bold text-lime-dark hover:brightness-95 disabled:opacity-40">{ocupado?"Guardando…":"Marcar como dictaminado"}</button>
    </div>}

    {!legal && <div className="mt-3 flex flex-wrap gap-2">
      {moral && !enDictamen(r) && !yaDictaminado(r) &&
        <button onClick={()=>accion(()=>apiEnviarLegal(r.id),"Enviado al área legal.")} disabled={ocupado||!expedienteCompleto}
          title={expedienteCompleto?"":"Primero completa el expediente"}
          className="rounded-lg border border-navy bg-navy px-4 py-2 text-sm font-semibold text-white hover:bg-navy-2 disabled:opacity-40">{ocupado?"Enviando…":"Enviar a dictamen legal"}</button>}
      {yaDictaminado(r) &&
        <button onClick={()=>accion(()=>apiEnviarContratos(r.id),"Enviado a Contratos.")} disabled={ocupado}
          className="rounded-lg border border-lime bg-lime px-4 py-2 text-sm font-bold text-lime-dark hover:brightness-95 disabled:opacity-40">{ocupado?"Enviando…":"Enviar a Contratos"}</button>}
      {moral && !enDictamen(r) && !yaDictaminado(r) && !expedienteCompleto &&
        <span className="self-center text-xs text-slate-400">Faltan documentos del expediente (sin contar contrato firmado, contrato en físico y videos de firma, que se recaban después).</span>}
    </div>}

    {msg && <p className="mt-2 rounded-lg border border-l-[6px] border-lime bg-lime-soft px-3 py-2 text-xs font-semibold text-navy">{msg}</p>}
    {err && <p className="mt-2 rounded-lg border border-l-[6px] border-red-500 bg-red-50 px-3 py-2 text-xs font-semibold text-red-700">{err}</p>}
  </div>);
}

/* ---------- Registro de cambios ---------- */
function HistorialCambios({id}){
  const [items,setItems]=useState(null);const [err,setErr]=useState("");
  useEffect(()=>{let vivo=true;apiHistorial(id).then(d=>{if(vivo)setItems(Array.isArray(d)?d:[]);}).catch(e=>{if(vivo)setErr(e.message);});return()=>{vivo=false;};},[id]);
  const fmt=s=>{const d=new Date(s);return `${d.getDate()} ${MESES[d.getMonth()].slice(0,3)} ${d.getFullYear()} · ${pad(d.getHours())}:${pad(d.getMinutes())}`;};
  return (<div className="rounded-lg border border-stone-200 p-3">
    <h3 className="text-sm font-bold text-navy mb-2 inline-flex items-center gap-1.5"><Icon name="history" size={15}/> Últimos cambios</h3>
    {err?<p className="text-xs text-red-600">No se pudo cargar el historial: {err}</p>:
     items===null?<p className="text-xs text-slate-400">Cargando…</p>:
     items.length===0?<p className="text-xs text-slate-400">Sin cambios registrados desde que se activaron los usuarios.</p>:
     <ul className="space-y-1">{items.slice(0,10).map((c,i)=>(<li key={i} className="flex flex-wrap items-baseline gap-x-2 text-xs"><span className="font-semibold text-slate-700">{c.usuario||"—"}</span><span className={`rounded px-1.5 py-0.5 text-[10px] font-bold ${c.accion==="alta"?"bg-lime-soft text-lime-ink":"bg-slate-100 text-slate-600"}`}>{c.accion==="alta"?"Alta":"Edición"}</span><span className="text-slate-500">{fmt(c.fecha)}</span></li>))}</ul>}
  </div>);
}

/* ---------- Piezas ---------- */
function Campo({label,children}){return <label className="block"><span className="mb-1 block text-xs font-semibold uppercase tracking-wide text-slate-500">{label}</span>{children}</label>;}
function Badges({r}){const es=(r.estatuses&&r.estatuses.length)?r.estatuses:[r.estatus];const ord=es.slice().sort((a,b)=>estIdx(a)-estIdx(b));return <div className="flex flex-wrap gap-1 justify-end max-w-[190px]">{ord.map(e=>{const c=ESTATUS_COLOR[e]||ESTATUS_COLOR[ESTATUS[0]];const p=e===r.estatus&&ord.length>1;return <span key={e} className={`inline-flex items-center rounded-full border px-2 py-0.5 text-[11px] font-medium whitespace-nowrap ${c.chip} ${p?"ring-1 ring-slate-400":""}`}>{e}</span>;})}</div>;}
function Badge({estatus}){const c=ESTATUS_COLOR[estatus]||ESTATUS_COLOR["Nueva"];return <span className={`inline-flex items-center rounded-full border px-2 py-0.5 text-xs font-medium whitespace-nowrap ${c.chip}`}>{estatus}</span>;}
function ContactoTag({contacto,compacto,inline}){const co=contacto==="Contestó";const cls=co?"text-emerald-600":"text-red-500";const dot=co?"bg-emerald-500":"bg-red-500";if(inline)return <span className={`font-semibold ${cls}`}>{contacto}</span>;return <span className={`inline-flex items-center gap-1 text-xs font-medium ${cls}`}><span className={`h-1.5 w-1.5 rounded-full ${dot}`}></span>{!compacto&&contacto}</span>;}
function TableroEtapas({counts,total,activo,onPick}){
  return (
    <div className="mb-5 rounded-xl border border-stone-200 bg-white p-3">
      <div className="flex items-center justify-between mb-2"><h3 className="text-xs font-bold uppercase tracking-wide text-slate-500">Clientes por etapa</h3><span className="text-xs text-slate-400">Total: <span className="mono font-bold text-slate-700">{total}</span></span></div>
      <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-2">
        {counts.map(({est,n})=>{const c=ESTATUS_COLOR[est];const on=activo===est;return (
          <button key={est} onClick={()=>onPick(est)} className={`rounded-lg border px-2.5 py-2 text-left transition-all ${on?"border-slate-400 ring-2 ring-slate-300 bg-stone-50":"border-stone-200 hover:bg-stone-50"} ${n===0?"opacity-45":""}`}>
            <div className="flex items-center gap-1.5"><span className={`h-2.5 w-2.5 rounded-full ${c.spine}`}></span><span className="text-lg font-bold mono text-slate-900 leading-none">{n}</span></div>
            <p className="mt-1 text-[11px] font-medium text-slate-500 leading-tight">{est}</p>
          </button>);})}
      </div>
    </div>
  );
}
function Kpi({icon,label,valor,tono}){return <div className="rounded-xl border border-stone-200 bg-white px-4 py-3"><div className="flex items-center gap-1.5 text-slate-400"><Icon name={icon} size={16}/><span className="text-xs font-medium text-slate-500">{label}</span></div><p className={`mt-1 text-2xl font-bold mono ${tono}`}>{valor}</p></div>;}
function Tab({activo,onClick,children}){return <button onClick={onClick} className={`rounded-t px-4 py-2.5 text-sm font-semibold ${activo?"bg-navy text-white":"text-slate-500 hover:text-navy"}`} aria-selected={activo}>{children}</button>;}
function Select({value,onChange,options,prefijo}){return <select value={value} onChange={e=>onChange(e.target.value)} className="rounded-lg border border-stone-300 bg-white px-2.5 py-1.5 text-sm text-slate-700 outline-none focus:border-slate-400 max-w-[180px]">{options.map(o=><option key={o} value={o}>{o==="Todos"?`${prefijo}: Todos`:o}</option>)}</select>;}
function Vacio({texto}){return <div className="rounded-xl border border-dashed border-stone-300 bg-white py-12 text-center"><Icon name="calendar" size={28} className="mx-auto text-stone-300"/><p className="mt-2 text-sm text-slate-500 max-w-xs mx-auto">{texto}</p></div>;}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
